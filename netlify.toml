[build]
# Two connection strings, on purpose. Migrations need session semantics
# (advisory locks, multi-statement DDL), so the build prefers
# MIGRATE_DATABASE_URL: Supabase's session pooler, port 5432. Request functions
# read DATABASE_URL directly and should get the transaction pooler, port 6543:
# in session mode every idle Lambda instance holds a dedicated backend, the
# cap fills, and new connections queue until they look like timeouts.
#
# The migration runs after the build but must not gate publishing. A failure
# is loud in the log and leaves the previous schema untouched.
command = "export DATABASE_URL=\"${MIGRATE_DATABASE_URL:-${NETLIFY_DATABASE_URL:-${DATABASE_URL:-$NETLIFY_DB_URL}}}\" && NITRO_PRESET=netlify pnpm build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm migrate:production || echo \"##### MIGRATION FAILED - site published anyway; database calls will fail until the connection string is fixed #####\"; fi"
publish = "dist"
functions = ".netlify/functions-internal"

[build.environment]
NODE_VERSION = "24"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
BETTER_AUTH_TRUSTED_ORIGINS = "https://shlawp.com,https://www.shlawp.com"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
