<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Shlawp: the plasma orb, no head. Colors match .shlawp-orb-plasma-a. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52DCFF"/>
      <stop offset="0.35" stop-color="#3370FF"/>
      <stop offset="0.7" stop-color="#A94CFA"/>
      <stop offset="1" stop-color="#FA3899"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3838FA" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#A94CFA" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#000000"/>
  <circle cx="32" cy="32" r="21" fill="url(#core)"/>
  <!-- soft halo behind the ring -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="url(#ring)" stroke-opacity="0.3" stroke-width="13"/>
  <!-- the ring -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="url(#ring)" stroke-width="6.5"/>
  <!-- pale inner rim, as on the orb -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#B8DBFF" stroke-opacity="0.6" stroke-width="1"/>
</svg>
